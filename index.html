<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="apple-touch-icon" href="favicon.png" />
<link rel="icon" type="image/png" href="favicon.png" />
<title>Anúncio Studio Pro | Gerador Profissional de Anúncios para Facebook</title>
<meta name="description" content="Sistema completo de geração de anúncios com 250+ templates, 500 copys persuasivas, imagens e recursos para produtos físicos e digitais." />
<style>
:root{--bg:#faf9f5;--card:#fff;--panel:#fdfdfb;--text:#111;--muted:#52524b;--border:#d9d8d0;--border-strong:#b6b5ac;--black:#1a1a1a;--gray:#f0f0eb;--danger:#9b1c1c;--danger-bg:#fdf3f3;--success:#1a7a3e;--success-bg:#f0f7f1;--warning:#8a6508;--warning-bg:#fdf9ec;--info:#1e4a8a;--info-bg:#eef3fa;--focus:#111;--shadow-soft:0 1px 3px rgba(0,0,0,.03);--shadow-lift:0 12px 32px rgba(0,0,0,.08);--radius:8px;--brand:#c2410c;--brand-bg:#fff7ed;--brand-border:#fed7aa;--purple:#4a1e8a;--purple-bg:#f5f0fd;--purple-border:#d9cdf2;--fb:#1877f2;--fb-bg:#e7f3ff;--pink:#be185d;--pink-bg:#fdf2f8;--pink-border:#fbcfe8}
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.55;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.app{display:grid;grid-template-columns:260px minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);height:100vh;width:100%}
.app-header{grid-column:1/-1;background:var(--card);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:20}
.brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:inherit;flex-shrink:0}
.brand-mark{width:36px;height:36px;border-radius:9px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:750;font-size:.8rem;letter-spacing:-.02em;box-shadow:0 4px 12px rgba(194,65,12,.3)}
.brand-name{font-size:.98rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;display:block}
.brand-tag{display:block;font-size:.7rem;color:var(--muted);font-weight:550;margin-top:1px}
.header-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.header-group{display:flex;align-items:center;gap:6px;padding-left:6px;margin-left:2px;border-left:1px solid var(--border)}
.header-group:first-child{padding-left:0;margin-left:0;border-left:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 13px;border-radius:6px;font-weight:600;font-size:.85rem;cursor:pointer;border:1px solid var(--black);background:var(--black);color:#fff;transition:all .15s;white-space:nowrap;text-decoration:none}
.btn:hover:not(:disabled){background:#333;border-color:#333}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{background:var(--gray);color:#6b6b64;border-color:var(--border);cursor:not-allowed}
.btn--ghost{background:#fff;color:var(--text);border-color:var(--border-strong)}
.btn--ghost:hover:not(:disabled){background:var(--gray);border-color:var(--black)}
.btn--ghost.is-active{background:var(--black);color:#fff;border-color:var(--black)}
.btn--sm{min-height:32px;padding:0 10px;font-size:.8rem}
.btn--xs{min-height:26px;padding:0 8px;font-size:.72rem}
.btn--icon{min-height:32px;min-width:32px;padding:0;background:transparent;color:var(--muted);border-color:transparent}
.btn--icon:hover:not(:disabled){background:var(--gray);color:var(--text);border-color:var(--border-strong)}
.btn--icon.danger:hover:not(:disabled){background:var(--danger-bg);color:var(--danger);border-color:#eccccc}
.btn--brand{background:var(--brand);border-color:var(--brand)}
.btn--brand:hover:not(:disabled){background:#9a3412;border-color:#9a3412}
.btn--fb{background:var(--fb);border-color:var(--fb)}
.btn--fb:hover:not(:disabled){background:#0a5dc2;border-color:#0a5dc2}
.sidebar{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar__scroll{flex:1;overflow-y:auto;padding:14px 10px 16px}
.sidebar__scroll::-webkit-scrollbar{width:8px}
.sidebar__scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.sidebar-section{margin-bottom:18px}
.sidebar-section:last-child{margin-bottom:0}
.sidebar-section__title{font-size:.66rem;font-weight:750;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 10px;margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;font-size:.86rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;text-align:left;width:100%;background:transparent;border:none}
.nav-item:hover{background:var(--gray);color:var(--text)}
.nav-item.is-active{background:var(--brand);color:#fff}
.nav-item.is-active .nav-item__icon{background:rgba(255,255,255,.15);color:#fff}
.nav-item__icon{width:28px;height:28px;border-radius:7px;background:var(--gray);color:var(--text);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.nav-item__icon svg{width:15px;height:15px}
.nav-item__badge{margin-left:auto;font-size:.66rem;font-weight:750;background:var(--gray);color:var(--muted);padding:2px 7px;border-radius:99px;min-width:22px;text-align:center}
.nav-item.is-active .nav-item__badge{background:rgba(255,255,255,.18);color:#fff}
.main{background:var(--bg);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.main__head{padding:14px 22px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0;flex-wrap:wrap}
.main__title{font-size:1.15rem;font-weight:750;letter-spacing:-.02em;line-height:1.2}
.main__sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.main__actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.main__scroll{flex:1;overflow-y:auto;min-height:0;padding:20px 22px 40px}
.main__scroll::-webkit-scrollbar{width:10px}
.main__scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;border:2px solid var(--bg)}
.rightpanel{background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.rightpanel__scroll{flex:1;overflow-y:auto;padding:0}
.rightpanel__scroll::-webkit-scrollbar{width:8px}
.rightpanel__scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;transition:all .18s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.kpi__label{font-size:.68rem;font-weight:750;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi__value{font-size:1.65rem;font-weight:750;letter-spacing:-.03em;line-height:1.1}
.kpi__sub{font-size:.76rem;color:var(--muted)}
.kpi__icon{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:8px;background:var(--brand-bg);color:var(--brand);display:inline-flex;align-items:center;justify-content:center}
.kpi__icon svg{width:17px;height:17px}
.kpi--fb .kpi__icon{background:var(--fb-bg);color:var(--fb)}
.kpi--purple .kpi__icon{background:var(--purple-bg);color:var(--purple)}
.kpi--success .kpi__icon{background:var(--success-bg);color:var(--success)}
.kpi--pink .kpi__icon{background:var(--pink-bg);color:var(--pink)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.panel-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.panel-card__head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-card__title{font-size:.9rem;font-weight:700;letter-spacing:-.01em}
.panel-card__body{padding:16px 18px}
.generator{display:grid;grid-template-columns:1fr;gap:16px}
.generator-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.generator-card__head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);flex-wrap:wrap}
.generator-card__title{font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:8px}
.generator-card__title span.step{width:22px;height:22px;border-radius:99px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:750;flex-shrink:0}
.generator-card__body{padding:18px}
.field-group{margin-bottom:16px}
.field-group:last-child{margin-bottom:0}
.field-group > label{display:block;font-size:.74rem;font-weight:650;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=tel],input[type=search],input[type=url],select,textarea{width:100%;min-height:36px;padding:7px 11px;border:1px solid var(--border-strong);border-radius:6px;background:#fff;color:var(--text);font-size:.86rem;transition:border-color .15s,box-shadow .15s;font-family:inherit}
input::placeholder,textarea::placeholder{color:#6b6b64;opacity:1}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(194,65,12,.1);outline:none}
textarea{min-height:120px;resize:vertical;line-height:1.6;font-family:inherit}
.var-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.var-chip{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:650;background:var(--gray);color:var(--muted);padding:4px 9px;border-radius:99px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.var-chip:hover{background:var(--brand-bg);color:var(--brand);border-color:var(--brand-border)}
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.template-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .18s;position:relative;text-align:left;display:flex;flex-direction:column;gap:8px}
.template-card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.template-card__icon{width:38px;height:38px;border-radius:9px;background:var(--brand-bg);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem}
.template-card__name{font-size:.88rem;font-weight:700;line-height:1.25}
.template-card__desc{font-size:.76rem;color:var(--muted);line-height:1.5;flex:1}
.template-card__meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.template-card__cat{font-size:.6rem;font-weight:750;text-transform:uppercase;letter-spacing:.06em;background:var(--gray);color:var(--muted);padding:2px 7px;border-radius:4px}
.template-card__count{font-size:.66rem;color:var(--muted);font-weight:650}
.template-card__badge{position:absolute;top:10px;right:10px;font-size:.55rem;font-weight:750;background:var(--purple-bg);color:var(--purple);padding:2px 6px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em}
.template-card__badge--digital{background:var(--pink-bg);color:var(--pink)}
.template-card__badge--fisico{background:var(--fb-bg);color:var(--fb)}
.preview-frame{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.preview-frame__head{padding:12px 16px;background:var(--fb);color:#fff;font-size:.78rem;font-weight:650;display:flex;align-items:center;gap:8px}
.preview-frame__head svg{width:14px;height:14px}
.fb-post{padding:16px}
.fb-post__header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fb-post__avatar{width:40px;height:40px;border-radius:99px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:750;font-size:.9rem;flex-shrink:0;overflow:hidden}
.fb-post__avatar img{width:100%;height:100%;object-fit:cover}
.fb-post__info{flex:1;min-width:0}
.fb-post__author{font-size:.85rem;font-weight:700;line-height:1.2}
.fb-post__meta{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.fb-post__meta::before{content:"🌐"}
.fb-post__body{font-size:.86rem;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;color:#050505;margin-bottom:12px}
.fb-post__images{display:grid;gap:4px;margin-bottom:12px;border-radius:8px;overflow:hidden}
.fb-post__images.count-1{grid-template-columns:1fr}
.fb-post__images.count-2{grid-template-columns:1fr 1fr}
.fb-post__images.count-3{grid-template-columns:1fr 1fr 1fr}
.fb-post__images.count-4{grid-template-columns:1fr 1fr}
.fb-post__images img{width:100%;height:auto;max-height:280px;object-fit:cover;display:block;background:var(--gray)}
.fb-post__footer{padding-top:12px;border-top:1px solid #e4e6eb;display:flex;gap:20px;color:#65676b;font-size:.78rem;font-weight:600}
.fb-post__footer span{display:inline-flex;align-items:center;gap:5px}
.fb-post__footer svg{width:14px;height:14px}
.fb-post__preview-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:.82rem}
.char-counter{display:flex;align-items:center;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:6px}
.char-counter .count{font-weight:700;font-variant-numeric:tabular-nums}
.char-counter.is-warning .count{color:var(--warning)}
.char-counter.is-over .count{color:var(--danger)}
.rp-section{padding:16px 18px;border-bottom:1px solid var(--border)}
.rp-section:last-child{border-bottom:none}
.rp-section__title{font-size:.68rem;font-weight:750;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.rp-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rp-stat{background:var(--gray);border:1px solid var(--border);border-radius:6px;padding:9px 11px}
.rp-stat small{display:block;font-size:.6rem;font-weight:750;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.rp-stat strong{display:block;font-size:.94rem;font-weight:750}
.rp-stat.is-brand{background:var(--brand-bg);border-color:var(--brand-border)}
.rp-stat.is-brand small{color:var(--brand)}
.rp-stat.is-brand strong{color:var(--brand)}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.group-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;transition:all .18s;position:relative}
.group-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--border-strong)}
.group-card__header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.group-card__icon{width:42px;height:42px;border-radius:10px;background:var(--fb-bg);color:var(--fb);display:inline-flex;align-items:center;justify-content:center;font-weight:750;flex-shrink:0;font-size:1rem}
.group-card__name{font-size:.88rem;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-card__members{font-size:.72rem;color:var(--muted);margin-top:2px}
.group-card__stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:12px;border-top:1px dashed var(--border);margin-top:12px}
.group-card__stat small{display:block;font-size:.6rem;font-weight:750;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.group-card__stat strong{font-size:.88rem;font-weight:750}
.group-card__actions{display:flex;gap:6px;margin-top:12px}
.group-card__actions .btn{flex:1}
.history-list{display:flex;flex-direction:column;gap:10px}
.history-item{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;transition:all .15s;cursor:pointer}
.history-item:hover{border-color:var(--brand);box-shadow:var(--shadow-soft)}
.history-item__icon{width:38px;height:38px;border-radius:9px;background:var(--brand-bg);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1rem}
.history-item__body{flex:1;min-width:0}
.history-item__title{font-size:.88rem;font-weight:700;margin-bottom:3px}
.history-item__excerpt{font-size:.78rem;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.history-item__meta{font-size:.7rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.history-item__actions{display:flex;flex-direction:column;gap:4px}
.schedule-list{display:flex;flex-direction:column;gap:8px}
.schedule-item{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:center;transition:all .15s}
.schedule-item:hover{border-color:var(--border-strong)}
.schedule-item__date{text-align:center;flex-shrink:0;min-width:60px;padding:6px 8px;background:var(--brand-bg);color:var(--brand);border-radius:8px}
.schedule-item__date .day{font-size:1.3rem;font-weight:750;line-height:1}
.schedule-item__date .month{font-size:.62rem;font-weight:750;text-transform:uppercase;margin-top:2px}
.schedule-item__info{flex:1;min-width:0}
.schedule-item__title{font-size:.86rem;font-weight:700;margin-bottom:2px}
.schedule-item__meta{font-size:.72rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.schedule-item__status{font-size:.68rem;font-weight:750;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.schedule-item__status.pending{background:var(--warning-bg);color:var(--warning)}
.schedule-item__status.done{background:var(--success-bg);color:var(--success)}
.schedule-item__status.cancelled{background:var(--danger-bg);color:var(--danger)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
.badge--success{background:var(--success-bg);color:var(--success)}
.badge--danger{background:var(--danger-bg);color:var(--danger)}
.badge--warning{background:var(--warning-bg);color:var(--warning)}
.badge--info{background:var(--info-bg);color:var(--info)}
.badge--purple{background:var(--purple-bg);color:var(--purple)}
.badge--brand{background:var(--brand-bg);color:var(--brand)}
.badge--pink{background:var(--pink-bg);color:var(--pink)}
.badge--fb{background:var(--fb-bg);color:var(--fb)}
.badge--neutral{background:var(--gray);color:var(--muted)}
.badge .dot{width:6px;height:6px;border-radius:99px;background:currentColor}
.empty-state{text-align:center;padding:48px 24px;color:var(--muted);font-size:.85rem;line-height:1.6;background:#fff;border:1px dashed var(--border-strong);border-radius:10px}
.empty-state svg{margin:0 auto 14px;color:var(--border-strong);width:42px;height:42px}
.empty-state strong{display:block;color:var(--text);font-weight:700;font-size:.98rem;margin-bottom:6px}
.filters-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.filters-bar__group{display:flex;gap:6px;align-items:center}
.filters-bar__group label{font-size:.72rem;font-weight:650;color:var(--muted)}
.filters-bar select,.filters-bar input{min-height:30px;padding:0 8px;font-size:.78rem;width:auto;min-width:120px}
dialog{border:1px solid var(--border);border-radius:12px;padding:0;width:calc(100% - 32px);background:var(--card);color:var(--text);box-shadow:0 30px 70px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(20,20,20,.55);backdrop-filter:blur(3px)}
.dialog-body{padding:24px 24px 20px;display:flex;flex-direction:column;gap:16px;max-height:80vh;overflow-y:auto}
.dialog-body h2{font-size:1.1rem;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dialog-body>p{font-size:.86rem;color:var(--muted);line-height:1.55}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border)}
.dialog-actions .btn{min-width:100px}
.modal--sm{max-width:440px}
.modal--md{max-width:620px}
.modal--lg{max-width:900px}
.toast{position:fixed;right:18px;bottom:18px;z-index:200;max-width:360px;padding:11px 15px;background:var(--black);color:#fff;border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.24);font-size:.85rem;font-weight:500;line-height:1.45;opacity:0;transform:translateY(12px);pointer-events:none;transition:all .2s}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.brand{background:var(--brand)}
.toast.fb{background:var(--fb)}
.mobile-tabs{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);z-index:30;padding:5px;grid-template-columns:repeat(3,1fr);gap:5px;box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.mobile-tab{min-height:42px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:6px;font-weight:650;font-size:.78rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 8px}
.mobile-tab[aria-selected="true"]{background:var(--brand);color:#fff}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid--full{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.74rem;font-weight:650;color:var(--muted)}
.field--full{grid-column:1/-1}
/* Copy library */
.copy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.copy-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;transition:all .15s;position:relative;display:flex;flex-direction:column;gap:8px}
.copy-card:hover{border-color:var(--brand);box-shadow:var(--shadow-soft)}
.copy-card__cat{font-size:.6rem;font-weight:750;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:4px;align-self:flex-start}
.copy-card__cat.hook{background:var(--brand-bg);color:var(--brand)}
.copy-card__cat.cta{background:var(--fb-bg);color:var(--fb)}
.copy-card__cat.urgencia{background:var(--danger-bg);color:var(--danger)}
.copy-card__cat.social{background:var(--success-bg);color:var(--success)}
.copy-card__cat.beneficio{background:var(--purple-bg);color:var(--purple)}
.copy-card__cat.objecao{background:var(--warning-bg);color:var(--warning)}
.copy-card__cat.fechamento{background:var(--pink-bg);color:var(--pink)}
.copy-card__text{font-size:.84rem;line-height:1.55;color:var(--text);flex:1}
.copy-card__actions{display:flex;gap:6px;justify-content:flex-end}
.copy-cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.copy-cat-chip{padding:6px 14px;background:#fff;border:1px solid var(--border);border-radius:99px;font-size:.78rem;font-weight:650;color:var(--muted);cursor:pointer;transition:all .15s}
.copy-cat-chip:hover{background:var(--gray);color:var(--text)}
.copy-cat-chip.is-active{background:var(--brand);color:#fff;border-color:var(--brand)}
.copy-cat-chip .n{font-size:.66rem;opacity:.7;margin-left:4px}
/* Image upload */
.image-upload{border:2px dashed var(--border-strong);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:all .15s;background:var(--panel)}
.image-upload:hover{border-color:var(--brand);background:var(--brand-bg)}
.image-upload.is-dragover{border-color:var(--brand);background:var(--brand-bg)}
.image-upload svg{color:var(--muted);margin-bottom:8px}
.image-upload p{font-size:.82rem;color:var(--muted);margin-bottom:4px}
.image-upload small{font-size:.7rem;color:var(--muted)}
.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.image-item{position:relative;border-radius:8px;overflow:hidden;background:var(--gray);aspect-ratio:1}
.image-item img{width:100%;height:100%;object-fit:cover}
.image-item__remove{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:99px;background:rgba(0,0,0,.7);color:#fff;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:750;line-height:1;transition:all .15s}
.image-item__remove:hover{background:var(--danger)}
.image-item__primary{position:absolute;bottom:6px;left:6px;font-size:.6rem;font-weight:750;background:var(--brand);color:#fff;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em}
.image-note{font-size:.72rem;color:var(--muted);margin-top:8px;display:flex;align-items:flex-start;gap:6px;line-height:1.5}
.image-note svg{width:13px;height:13px;flex-shrink:0;margin-top:2px;color:var(--info)}
/* Product type filter */
.type-filter{display:flex;gap:6px;flex-wrap:wrap}
.type-chip{padding:6px 14px;background:#fff;border:1px solid var(--border);border-radius:99px;font-size:.76rem;font-weight:650;color:var(--muted);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.type-chip:hover{background:var(--gray);color:var(--text)}
.type-chip.is-active{background:var(--black);color:#fff;border-color:var(--black)}
.type-chip .ic{font-size:.85rem}
/* Suggestion for physical/digital specific fields */
.product-fields{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px}
.product-fields__title{font-size:.72rem;font-weight:750;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.product-fields__grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.product-fields__grid .field label{font-size:.7rem}
.product-fields__grid .field input{font-size:.82rem}
@media (max-width:1200px){.app{grid-template-columns:220px minmax(0,1fr) 340px}.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
@media (max-width:900px){
  body{overflow:auto}
  .app{display:block;height:auto;min-height:100vh;padding-bottom:56px}
  .panel,.sidebar,.main,.rightpanel{display:none;height:calc(100vh - 60px - 56px);border:none!important}
  .panel.is-active,.sidebar.is-active,.main.is-active,.rightpanel.is-active{display:flex}
  .mobile-tabs{display:grid}
  .main__scroll{padding:14px 12px 30px}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:10px}
  .grid-2{grid-template-columns:1fr;gap:12px}
  .header-actions .header-group{display:none}
  .header-actions .header-group:first-child{display:flex}
  .form-grid{grid-template-columns:1fr}
  .product-fields__grid{grid-template-columns:1fr}
}
@media (max-width:520px){.kpi-grid{grid-template-columns:1fr}}
@media print{

  .app-header,.sidebar,.rightpanel,.mobile-tabs,.toast,dialog,.main__actions{display:none!important}
  .app{display:block;height:auto}
  .main{display:block;height:auto}
  .main__scroll{overflow:visible;padding:0}
}
</style>

const fmtDate=iso=>{try{return new Date(iso).toLocaleDateString('pt-BR')}catch{return iso}};
const fmtDateTime=iso=>{try{return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return iso}};
const todayISO=()=>new Date().toISOString().slice(0,10);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

function lsGet(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){
  if(k===LS.images)toast('Espaço cheio — remova imagens antigas.','error');
}}

function toast(msg,type=''){
  const el=$('toast');
  el.className='toast '+type;el.textContent=msg;el.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.classList.remove('show'),2800);
}

function confirmDialog(title,message){
  return new Promise(resolve=>{
    const dlg=$('confirm-dialog');
    $('confirm-title').textContent=title;
    $('confirm-message').textContent=message;
    const ok=$('confirm-ok'),cancel=$('confirm-cancel');
    const cleanup=()=>{ok.removeEventListener('click',onOk);cancel.removeEventListener('click',onCancel);dlg.removeEventListener('close',onClose)};
    const onOk=()=>{cleanup();dlg.close();resolve(true)};
    const onCancel=()=>{cleanup();dlg.close();resolve(false)};
    const onClose=()=>{cleanup();resolve(false)};
    ok.addEventListener('click',onOk);cancel.addEventListener('click',onCancel);
    dlg.addEventListener('close',onClose);dlg.showModal();cancel.focus();
  });
}

function saveAll(){
  lsSet(LS.groups,state.groups||[]);
  lsSet(LS.history,state.history||[]);
  lsSet(LS.schedule,state.schedule||[]);
  lsSet(LS.variables,state.variables||{});
  lsSet(LS.current,state.template?.id||'');
}

function normalizeState(){
  const a=v=>Array.isArray(v)?v:[];
  state.groups=a(state.groups);state.history=a(state.history);
  state.schedule=a(state.schedule);state.images=a(state.images);
  if(!state.variables||typeof state.variables!=='object')state.variables={...DEFAULT_VARIABLES};
}

function loadAll(){
  try{
    state.groups=lsGet(LS.groups,null);
    state.history=lsGet(LS.history,[]);
    state.schedule=lsGet(LS.schedule,[]);
    state.variables=lsGet(LS.variables,null);
    if(!state.groups){seedData();return}
    normalizeState();
    state.variables={...DEFAULT_VARIABLES,...state.variables};
    if(state.groups.length===0)seedGroups();
    saveAll();
  }catch(err){console.error('[Anúncio Studio]',err);seedData()}
}

const getGroup=id=>state.groups.find(g=>g.id===id);

function extractVariables(content){
  const found=new Set();
  const re=/\{\{([A-ZÀ-Ú_0-9]+)\}\}/g;
  let m;while((m=re.exec(content))!==null)found.add(m[1]);
  return Array.from(found);
}
function applyVariables(content){
  return content.replace(/\{\{([A-ZÀ-Ú_0-9]+)\}\}/g,(m,k)=>{
    const v=state.variables[k];return v&&String(v).trim()?v:m;
  });
}
function charCount(content){return applyVariables(content).length}
function getCatIcon(cat){
  const i={promocao:'🔥',fisico:'📦',digital:'💾',servico:'🔧',evento:'🎉',emprego:'💼',
    imovel:'🏠',curso:'🎓',ebook:'📖',mentoria:'🎯',saas:'💻',comunidade:'👥',
    freela:'💼',indicacao:'🎁',institucional:'🏢',datas:'📅',infoproduto:'📚',nicho:'⭐'};
  return i[cat]||'📝';
}

function handleAction(a){
  switch(a){
    case 'new-ad':state.template=null;state.content='';state.images=[];setView('generator');break;
    case 'copy':copyAd();break;
    case 'schedule':openScheduleDialog();break;
    case 'save-ad':saveAdToHistory();break;
    case 'clear-history':clearHistory();break;
    case 'new-group':openGroupDialog();break;
    case 'new-variable':openVariableDialog();break;
    case 'reset-vars':
      confirmDialog('Restaurar variáveis','Voltar todas as variáveis ao padrão?').then(ok=>{
        if(ok){state.variables={...DEFAULT_VARIABLES};saveAll();render();toast('Variáveis restauradas.')}
      });break;
    case 'print':window.print();break;
    case 'clear-images':
      confirmDialog('Limpar imagens','Remover todas as imagens salvas?').then(ok=>{
        if(ok){state.images=[];lsSet(LS.images,[]);updateBadges();render();toast('Imagens removidas.')}
      });break;
    case 'copy-all-copies':exportAllCopies();break;
  }
}

function renderTemplates(){
  const cat=state.selectedTemplateCat||'all';

  let filtered=TEMPLATES;
  if(cat!=='all')filtered=filtered.filter(t=>t.cat===cat);
  if(type!=='all')filtered=filtered.filter(t=>t.type===type);

  return `
    <div class="filters-bar" style="border-radius:10px;border:1px solid var(--border);margin-bottom:16px">

        <select id="tpl-cat-filter">

        return `<button type="button" class="template-card" data-tpl-id="${t.id}">

}

/* =========================================================================
   SCHEDULE VIEW
   ========================================================================= */
function renderSchedule(){
  const sorted=[...state.schedule].sort((a,b)=>new Date(a.date+'T'+a.time)-new Date(b.date+'T'+b.time));
  const pending=sorted.filter(s=>s.status==='pending');
  const done=sorted.filter(s=>s.status==='done');
  const cancelled=sorted.filter(s=>s.status==='cancelled');
  if(!sorted.length)return `<div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <strong>Nenhum agendamento</strong>Agende publicações para não perder os melhores horários.
    <div style="margin-top:20px"><button type="button" class="btn btn--brand" data-action="schedule">Novo agendamento</button></div>
  </div>`;
  return `
    ${pending.length?`<div style="margin-bottom:24px"><div class="rp-section__title" style="padding:0 0 12px">📅 Pendentes (${pending.length})</div><div class="schedule-list">${pending.map(s=>renderSchedItem(s)).join('')}</div></div>`:''}
    ${done.length?`<div style="margin-bottom:24px"><div class="rp-section__title" style="padding:0 0 12px">✅ Publicados (${done.length})</div><div class="schedule-list">${done.slice(0,10).map(s=>renderSchedItem(s)).join('')}</div></div>`:''}
    ${cancelled.length?`<div><div class="rp-section__title" style="padding:0 0 12px">🚫 Cancelados (${cancelled.length})</div><div class="schedule-list">${cancelled.slice(0,5).map(s=>renderSchedItem(s)).join('')}</div></div>`:''}
  `;
}
function renderSchedItem(s){
  const g=getGroup(s.groupId);
  const d=new Date(s.date+'T'+s.time);
  const day=String(d.getDate()).padStart(2,'0');
  const m=d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','').toUpperCase();
  return `<div class="schedule-item">
    <div class="schedule-item__date"><div class="day">${day}</div><div class="month">${m}</div></div>
    <div class="schedule-item__info">
      <div class="schedule-item__title">${esc(s.title||'Publicação')}</div>
      <div class="schedule-item__meta"><span>🕐 ${s.time}</span><span>📍 ${esc(g?.name||'Sem grupo')}</span></div>
    </div>
    <span class="schedule-item__status ${s.status}">${s.status==='pending'?'Pendente':s.status==='done'?'Publicado':'Cancelado'}</span>
    ${s.status==='pending'?`<button type="button" class="btn btn--icon btn--sm" data-sched-done="${s.id}" title="Marcar publicado"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg></button>`:''}
    <button type="button" class="btn btn--icon btn--sm danger" data-sched-rm="${s.id}"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg></button>
  </div>`;
}

/* =========================================================================

   ========================================================================= */
function renderAnalytics(){
  const byCat={},byGroup={},byType={};
  state.history.forEach(h=>{
    byCat[h.templateCat]=(byCat[h.templateCat]||0)+1;
    if(h.groupId)byGroup[h.groupId]=(byGroup[h.groupId]||0)+1;
    if(h.templateType)byType[h.templateType]=(byType[h.templateType]||0)+1;
  });
  const topCats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const topGroups=Object.entries(byGroup).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxCat=topCats.length?topCats[0][1]:1;
  return `
    <div class="kpi-grid">
      <div class="kpi kpi--brand"><span class="kpi__label">Anúncios</span><span class="kpi__value">${state.history.length}</span><span class="kpi__sub">criados</span></div>
      <div class="kpi kpi--fb"><span class="kpi__label">📦 Físicos</span><span class="kpi__value">${byType.fisico||0}</span><span class="kpi__sub">produtos físicos</span></div>
      <div class="kpi kpi--pink"><span class="kpi__label">💾 Digitais</span><span class="kpi__value">${byType.digital||0}</span><span class="kpi__sub">produtos digitais</span></div>
      <div class="kpi kpi--purple"><span class="kpi__label">Templates</span><span class="kpi__value">${Object.keys(byCat).length}</span><span class="kpi__sub">categorias usadas</span></div>
    </div>
    <div class="grid-2">
      <div class="panel-card">
        <div class="panel-card__head"><span class="panel-card__title">Top categorias</span></div>
        <div class="panel-card__body">
          ${topCats.length?topCats.map(([c,n])=>`
            <div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:5px">
                <strong>${esc(CATS[c]||c)}</strong><span style="color:var(--brand);font-weight:750">${n}</span>
              </div>
              <div style="height:8px;background:var(--gray);border-radius:99px;overflow:hidden">
                <div style="height:100%;width:${(n/maxCat)*100}%;background:var(--brand);border-radius:99px"></div>
              </div>
            </div>`).join(''):'<div class="empty-state" style="padding:20px">Sem dados</div>'}
        </div>
      </div>
      <div class="panel-card">
        <div class="panel-card__head"><span class="panel-card__title">Grupos mais usados</span></div>
        <div class="panel-card__body">
          ${topGroups.length?topGroups.map(([gid,n])=>{
            const g=getGroup(gid);
            return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border)">
              <div class="group-card__icon" style="width:32px;height:32px;font-size:.72rem">${esc((g?.name||'??').substring(0,2).toUpperCase())}</div>
              <div style="flex:1;font-size:.84rem;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g?.name||'Removido')}</div>

/* =========================================================================
   IMAGE HANDLING
   ========================================================================= */
function handleImageFiles(files){
  if(!files||!files.length)return;
  const arr=Array.from(files).slice(0,5);
  arr.forEach(file=>{
    if(!file.type.startsWith('image/'))return;
    if(file.size>5*1024*1024){toast(`${file.name} é muito grande (máx 5MB).`,'error');return}
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=800;
        let {width:w,height:h}=img;
        if(w>MAX||h>MAX){
          if(w>h){h=Math.round(h*(MAX/w));w=MAX}
          else{w=Math.round(w*(MAX/h));h=MAX}
        }
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        const src=canvas.toDataURL('image/jpeg',0.75);
        state.images.push({id:uid(),src,name:file.name,size:src.length});
        if(state.images.length>10)state.images=state.images.slice(-10);
        lsSet(LS.images,state.images);
        updateBadges();
        if(state.view==='generator'){renderMainContent();renderRightPanel()}
        toast(`${file.name} adicionada.`,'success');
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function saveAdToHistory(){
  const content=state.content||state.template?.content||'';
  if(!content){toast('Nada para salvar.','error');return}
  const final=applyVariables(content);
  const firstLine=final.split('\n').find(l=>l.trim())||'Anúncio';
  const title=firstLine.replace(/[🔴🟠🟡🟢🔵🟣⚫⚪🔥💥✨🎉🎓💼🚀📢📣🛒💡🎁📍🏠👥🤝💰📱📲👇👉🖤💚❤️💜🧡💙🤍♿🎬🍕🍔🍰🧁🍱📸✨🌊]/g,'').trim().substring(0,60)||'Sem título';
  state.history.unshift({
    id:uid(),title,content:final,rawContent:content,
    templateId:state.template?.id||null,
    templateCat:state.template?.cat||null,
    templateType:state.template?.type||null,
    templateIcon:state.template?getCatIcon(state.template.cat):'📝',
    images:JSON.parse(JSON.stringify(state.images)),

function exportAllCopies(){

    EMAIL:'contato@exemplo.com',SITE:'www.exemplo.com',CIDADE:'São Paulo',AREA:'Brasil',
    PRAZO:'3 a 5 dias úteis',GARANTIA:'90 dias',PESO:'0,5',DIMENSOES:'20x15x10cm',ESTOQUE:'50 unidades',
    FORMATO:'PDF e Vídeo',ACESSO:'Vitalício',SUPORTE:'WhatsApp e E-mail',PLATAFORMA:'Hotmaart'
  };
  extractVariables(state.template.content).forEach(v=>{
    if(demo[v])state.variables[v]=demo[v];

  });

  saveAll();render();toast('Variáveis preenchidas com exemplo.','brand');
}

/* =========================================================================
   EXPORT / IMPORT
   ========================================================================= */
function exportJSON(){
  const d={version:2,exportedAt:new Date().toISOString(),
    groups:state.groups,history:state.history,schedule:state.schedule,
    variables:state.variables,images:state.images};
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download=`anuncio-studio-backup-${todayISO()}.json`;a.click();
  URL.revokeObjectURL(url);toast('Backup exportado.','success');
}
function exportTxt(){
  const c=state.content||state.template?.content||'';
  if(!c){toast('Nada para exportar.','error');return}
  const final=applyVariables(c);
  const blob=new Blob([final],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download=`anuncio-${todayISO()}.txt`;a.click();
  URL.revokeObjectURL(url);toast('Anúncio exportado.','success');
}
function importFile(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.groups)state.groups=d.groups;
      if(d.history)state.history=d.history;
      if(d.schedule)state.schedule=d.schedule;
      if(d.variables)state.variables={...DEFAULT_VARIABLES,...d.variables};
      if(d.images)state.images=d.images;
      normalizeState();saveAll();updateBadges();render();
      toast('Backup importado.','success');
    }catch(err){toast('Erro: '+err.message,'error')}
  };
  r.readAsText(file);
}

/* =========================================================================
   MOBILE TABS
   ========================================================================= */
function bindMobileTabs(){
  document.querySelectorAll('[data-mobile-panel]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const t=btn.dataset.mobilePanel;
      document.querySelectorAll('.mobile-tab').forEach(b=>b.setAttribute('aria-selected','false'));
      document.querySelectorAll('.sidebar,.main,.rightpanel').forEach(p=>p.classList.remove('is-active'));
      btn.setAttribute('aria-selected','true');
      $(`panel-${t}`).classList.add('is-active');
    });
  });
}

/* =========================================================================
   BOOTSTRAP
   ========================================================================= */
function bootstrap(){
  try{
    loadAll();
    state.images=lsGet(LS.images,[]);
    normalizeState();
    bindGlobal();
    bindMobileTabs();
    updateBadges();
    render();
    console.log('[Anúncio Studio Pro] ✅ Iniciado');
    console.log('[Anúncio Studio Pro]',{
      templates:TEMPLATES.length,copies:COPIES.length,
      categorias:Object.keys(CATS).length,
      grupos:state.groups.length,histórico:state.history.length,imagens:state.images.length
    });
  }catch(err){
    console.error('[Anúncio Studio Pro] ❌ Erro:',err);
    toast('Erro ao inicializar. Verifique o console.','error');
  }
}

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',bootstrap)}
else{bootstrap()}
</script>
